spring:
  application:
    name: account-service

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  datasource:
    url: jdbc:mysql://localhost:3306/accountdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8097

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9999/eureka/

billing:
  app: This is account service